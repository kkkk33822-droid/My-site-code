<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VIP资源站</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #f06292; color: #fff; min-height: 100vh; padding: 30px 18px 80px; overflow-x: hidden;
        }
        ::-webkit-scrollbar { display: none; }
        .header { text-align: center; margin-bottom: 20px; }
        .avatar { width: 90px; height: 90px; border-radius: 50%; overflow: hidden; margin: 0 auto 18px; border: 3px solid rgba(255,255,255,.6); box-shadow: 0 6px 20px rgba(0,0,0,.15); background: #fff; }
        .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .site-name { font-size: 26px; font-weight: 900; letter-spacing: 2px; color: #1a1a2e; text-shadow: 1px 1px 0 rgba(255,255,255,.4); margin-bottom: 14px; }
        .desc { font-size: 13px; color: #1a1a2e; line-height: 1.7; text-align: center; padding: 0 10px; font-weight: 500; margin-bottom: 26px; }
        .link-list { display: flex; flex-direction: column; gap: 14px; max-width: 500px; margin: 0 auto; }
        .link-item { display: flex; align-items: center; background: #f9b6cf; border: 2px solid #ffffff; border-radius: 50px; padding: 10px 18px 10px 10px; text-decoration: none; color: #1a1a2e; transition: transform .15s, background .2s; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
        .link-item:active { transform: scale(.97); background: #f8a4c3; }
        .link-icon { width: 48px; height: 48px; border-radius: 50%; background: #fff; display: flex; align-items: center; justify-content: center; margin-right: 14px; flex-shrink: 0; overflow: hidden; box-shadow: 0 2px 6px rgba(0,0,0,.08); }
        .link-icon svg { width: 32px; height: 32px; }
        .link-text { flex: 1; text-align: center; font-size: 16px; font-weight: bold; letter-spacing: 1px; color: #1a1a2e; }
        .link-arrow { font-size: 22px; color: #666; font-weight: bold; flex-shrink: 0; margin-left: 4px; }
        .link-icon.refund { background: #e74c3c; color: #fff; font-size: 11px; font-weight: bold; line-height: 1.15; text-align: center; padding: 4px; }
        .bottom-bar { position: fixed; left: 0; bottom: 0; width: 100%; background: rgba(255,255,255,.95); display: flex; align-items: center; gap: 8px; padding: 10px 12px; font-size: 12px; color: #333; box-shadow: 0 -2px 10px rgba(0,0,0,.06); overflow-x: auto; white-space: nowrap; }
        .bottom-bar .label { color: #888; flex-shrink: 0; }
        .bottom-bar .tag { background: #f0f0f0; color: #333; padding: 5px 12px; border-radius: 14px; flex-shrink: 0; }
        .bottom-bar .close-btn { margin-left: auto; font-size: 16px; color: #888; cursor: pointer; padding: 0 6px; flex-shrink: 0; }
    </style>
</head>
<body>

    <div class="header">
        <div class="avatar"><img src="https://picsum.photos/seed/avatar/200/200" alt="头像"></div>
        <div class="site-name">VIP资源站</div>
        <div class="desc">资源都在下面的网盘里面，一定要把网盘里面的资源转存到你自己的网盘。因为随时会失效。下面两个网盘资源，请全部保存到你自己的网盘</div>
    </div>

    <div class="link-list">
        <a class="link-item" href="https://drive.uc.cn" target="_blank" rel="noopener">
            <div class="link-icon"><svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="22" fill="#ff7d00"/><path d="M30 18c-2-1-4-1-6 0-2-3-6-3-8 0-3 1-5 4-5 7 0 2 1 3 3 3 1 0 2 0 3-1 2 3 6 5 13 5s11-2 13-5c1 1 2 1 3 1 2 0 3-1 3-3 0-3-2-6-5-7-2-3-6-3-8 0-2-1-4-1-6 0z" fill="#fff"/></svg></div>
            <div class="link-text">[UC]资源合集 🔗</div><div class="link-arrow">›</div>
        </a>
        <a class="link-item" href="https://pan.quark.cn" target="_blank" rel="noopener">
            <div class="link-icon"><svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="22" fill="#fff"/><circle cx="24" cy="24" r="15" fill="none" stroke="#2a6cf5" stroke-width="8"/></svg></div>
            <div class="link-text">[夸克]资源合集 🔗</div><div class="link-arrow">›</div>
        </a>
        <a class="link-item" href="https://pan.xunlei.com" target="_blank" rel="noopener">
            <div class="link-icon"><svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="22" fill="#2a6cf5"/><path d="M14 24l10-10 5 5-5 5h8l-8 8-5-5 5-5h-8l5-5z" fill="#fff"/><path d="M28 30l6-6 4 4-6 6z" fill="#fff"/></svg></div>
            <div class="link-text">[迅雷]资源合集 🔗</div><div class="link-arrow">›</div>
        </a>
        <a class="link-item" href="mailto:support@example.com" target="_blank" rel="noopener">
            <div class="link-icon refund">申请<br>退款</div><div class="link-text">申请退款点这里 🔗</div><div class="link-arrow">›</div>
        </a>
    </div>

    <div class="bottom-bar" id="bottomBar">
        <span class="label">相关搜索</span><span class="tag">花扇的资源站地铁跑酷</span><span class="tag">ok资源站帮助中心</span><span class="tag">b站教育资源哪个最好</span><span class="tag">终末地资</span>
        <span class="close-btn" id="closeBar">✕</span>
    </div>

    <script>
        document.getElementById('closeBar').addEventListener('click', () => { document.getElementById('bottomBar').style.display = 'none'; });
    </script>
</body>
</html>
