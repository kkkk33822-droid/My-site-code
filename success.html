<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>审核通过</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            padding: 20px;
        }
        .card {
            background: #fff;
            color: #222;
            border-radius: 20px;
            padding: 40px 24px;
            text-align: center;
            max-width: 360px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,.2);
            animation: popIn .4s ease;
        }
        @keyframes popIn {
            from { opacity: 0; transform: scale(.85); }
            to { opacity: 1; transform: scale(1); }
        }
        .icon { font-size: 60px; margin-bottom: 16px; }
        h1 { font-size: 22px; margin-bottom: 10px; color: #222; }
        p { font-size: 14px; color: #666; line-height: 1.6; margin-bottom: 24px; }
        .btn {
            display: block;
            width: 100%;
            background: linear-gradient(90deg, #7c4dff, #b388ff);
            color: #fff;
            text-decoration: none;
            padding: 14px 0;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 12px;
            border: none;
            cursor: pointer;
        }
        .btn:active { opacity: .85; }
        .btn-secondary {
            display: block;
            width: 100%;
            background: #f0f0f5;
            color: #555;
            text-decoration: none;
            padding: 12px 0;
            border-radius: 25px;
            font-size: 14px;
            font-weight: bold;
        }
        .btn-secondary:active { background: #e0e0e8; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">✅</div>
        <h1>审核已通过</h1>
        <p>资源已解锁，点击下方按钮获取资源</p>
        <button class="btn" id="downloadBtn">📥 立即下载资源</button>
        <a class="btn-secondary" href="index.html">返回首页</a>
    </div>

    <script>
        // 从 URL 读取视频 id
        const params = new URLSearchParams(location.search);
        const id = params.get('id') || '';

        document.getElementById('downloadBtn').addEventListener('click', () => {
            // 这里把下载链接换成你的实际资源地址
            // window.location.href = 'https://你的网盘链接';
            alert('正在打开资源链接... (id: ' + id + ')');
        });
    </script>
</body>
</html>
