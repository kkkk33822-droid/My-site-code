<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>免费资源站</title>
    <style>
        /* ===== 基础重置 ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0d0d12; color: #fff;
            padding-bottom: 60px; overflow-x: hidden;
        }
        a { text-decoration: none; color: inherit; }
        img { display: block; width: 100%; height: 100%; object-fit: cover; }
        ::-webkit-scrollbar { display: none; }

        /* ===== 顶部播报公告 ===== */
        .top-notice { 
            background-color: #16161e; 
            padding: 4px 0; 
            overflow: hidden; 
            white-space: nowrap; 
            position: relative;
        }
        .top-notice-content {
            display: inline-block;
            font-size: 11px; 
            color: #a0a0b0;
            animation: marquee 12s linear infinite;
            padding-left: 100%;
        }
        .top-notice-content span { color: #e5a93d; font-weight: bold; }
        @keyframes marquee {
            0% { transform: translateX(0); }
            100% { transform: translateX(-100%); }
        }

        /* ===== 顶部横幅 ===== */
        .top-banners { display: flex; gap: 6px; padding: 6px 10px 0 10px; }
        .banner-item {
            flex: 1; height: 30px; border-radius: 15px;
            display: flex; align-items: center; justify-content: center;
            gap: 4px; font-size: 12px; font-weight: bold; color: #fff;
            cursor: pointer; transition: transform .15s;
            position: relative;
        }
        .banner-item:active { transform: scale(.96); }
        .banner-hot { background: linear-gradient(90deg, #ff8c00, #ffb347); }
        .banner-anime { background: linear-gradient(90deg, #4b3b7b, #6b5b9b); border: 1px solid #5a4a8a; }
        .banner-comic { background: linear-gradient(90deg, #1e3a8a, #3b82f6); }
        
        .second-banners { display: flex; gap: 6px; padding: 4px 10px 6px 10px; }
        .second-banners .banner-item { background: #1c1c26; border: 1px solid #2a2a3a; height: 30px; }
        .second-banners .banner-item:nth-child(2) { background: linear-gradient(90deg, #3b4b6b, #4b5b7b); border: none; }
        .second-banners .banner-item:nth-child(3) { background: linear-gradient(90deg, #5b4b3b, #7b6b4b); border: none; }

        .banner-item.active::after {
            content: '';
            position: absolute;
            left: 10px; right: 10px; bottom: -4px;
            height: 2px;
            background: #ffb347;
            border-radius: 1px;
        }

        /* ===== 搜索区 ===== */
        .search-section { padding: 0 10px 4px 10px; }
        .search-box { display: flex; background: #fff; border-radius: 6px; overflow: hidden; height: 34px; }
        .search-icon { display: flex; align-items: center; justify-content: center; width: 34px; color: #666; font-size: 14px; }
        .search-box input { flex: 1; border: none; outline: none; font-size: 12px; color: #333; background: transparent; }
        .search-btn { background: #ffb347; color: #5a3a00; border: none; padding: 0 12px; font-weight: bold; font-size: 12px; border-radius: 6px; margin: 3px; cursor: pointer; }
        
        .search-hint { 
            text-align: center; font-size: 10px; color: #888; margin-top: 2px; 
            animation: pulseSize 1.5s infinite ease-in-out;
            display: flex; align-items: center; justify-content: center; gap: 4px;
        }
        .search-hint span { color: #e5a93d; }
        @keyframes pulseSize {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; color: #e5a93d; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }

        .search-alert {
            display: none;
            margin: 8px 0 0 0;
            background: linear-gradient(90deg, #e53935, #c62828);
            border-radius: 6px;
            padding: 10px 8px 12px;
            text-align: center;
            color: #fff;
            box-shadow: 0 4px 10px rgba(229,57,53,.35);
            animation: alertPop .3s ease;
        }
        .search-alert.show { display: block; }
        @keyframes alertPop {
            from { opacity: 0; transform: translateY(-10px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .search-alert .alert-text { font-size: 12px; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 4px; margin-bottom: 8px; }
        .search-alert .alert-text .icon { font-size: 14px; }
        .search-alert .btn-unlock { display: inline-block; background: #ffffff; color: #e53935; border: none; border-radius: 14px; padding: 6px 20px; font-size: 12px; font-weight: bold; cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,.15); transition: transform .15s; }
        .search-alert .btn-unlock:active { transform: scale(.95); }

        /* ===== 在线人数 ===== */
        .online-wrapper {
            display: flex; 
            justify-content: center; 
            margin: 6px 10px 8px 10px;
        }
        .online-bar { 
            display: inline-flex; 
            align-items: center; 
            gap: 6px; 
            padding: 5px 16px; 
            font-size: 12px; 
            color: #ccc; 
            background: #1c1c26; 
            border-radius: 20px; 
            border: 1px solid #333; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        .online-icon { font-size: 13px; }
        .online-num { 
            color: #ffcc00; font-weight: 900; font-size: 14px;
            display: inline-block; min-width: 36px; text-align: center; 
            letter-spacing: 0.5px;
        }
        .online-dot {
            width: 8px; height: 8px;
            background-color: #4ade80;
            border-radius: 50%;
            box-shadow: 0 0 6px #4ade80;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.9); opacity: 0.7; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(0.9); opacity: 0.7; }
        }

        /* ===== 分类标题栏 ===== */
        .cat-bar { display: flex; align-items: center; padding: 0 10px 4px 10px; gap: 4px; }
        .cat-bar .icon {
            width: 16px; height: 16px;
            background: linear-gradient(135deg, #ff9800, #ffb74d);
            border-radius: 3px;
            display: flex; align-items: center; justify-content: center;
            font-size: 10px;
        }
        .cat-bar .title { font-size: 12px; font-weight: bold; color: #fff; }
        .cat-bar .subtitle { margin-left: auto; font-size: 10px; color: #888; }

        .content-area { padding: 0; }

        /* ===== 2列卡片 ===== */
        .grid-2 { 
            display: grid; 
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 8px; 
            padding: 0 8px; 
        }
        .card-wide { 
            background: #1a1a24; 
            border-radius: 6px; 
            overflow: hidden; 
            cursor: pointer; 
            transition: transform .15s; 
        }
        .card-wide:active { transform: scale(.97); }
        
        .card-wide .thumb { 
            position: relative; 
            width: 100%; 
            aspect-ratio: 3 / 1;
            background: #333; 
        }
        .card-wide .tag { 
            position: absolute; top: 4px; left: 4px; 
            background: #e55c5c; color: #fff; 
            font-size: 9px; padding: 2px 5px; 
            border-radius: 3px; z-index: 2; 
        }
        .card-wide .play-btn { 
            position: absolute; top: 50%; left: 50%; 
            transform: translate(-50%, -50%); 
            width: 22px; height: 22px; 
            background: rgba(255,255,255,.35); 
            border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; 
            z-index: 2; 
        }
        .card-wide .play-btn::after { 
            content: ''; width: 0; height: 0; 
            border-top: 4px solid transparent; 
            border-bottom: 4px solid transparent; 
            border-left: 7px solid #fff; 
            margin-left: 3px; 
        }
        .card-wide .dur { 
            position: absolute; bottom: 4px; right: 4px; 
            background: rgba(0,0,0,.6); color: #fff; 
            font-size: 9px; padding: 2px 4px; 
            border-radius: 3px; z-index: 2; 
        }
        .card-wide .stat { 
            position: absolute; bottom: 4px; left: 4px; 
            display: flex; align-items: center; gap: 3px; 
            font-size: 9px; color: #ddd; z-index: 2; 
        }
        .card-wide .finished { 
            position: absolute; bottom: 4px; right: 4px; 
            background: rgba(0,0,0,.7); color: #fff; 
            font-size: 9px; padding: 2px 6px; 
            border-radius: 3px; z-index: 2; 
        }
        .card-wide .name { 
            font-size: 12px; 
            color: #eee; 
            padding: 6px 5px; 
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; 
            line-height: 1.3; 
        }

        /* ===== 其他分类 ===== */
        .grid-4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; padding: 0 4px; }
        .card-square { background: #1a1a24; border-radius: 4px; overflow: hidden; cursor: pointer; display: flex; flex-direction: column; }
        .card-square .thumb { width: 100%; aspect-ratio: 1 / 1; background: #fff; }
        .card-square .name { font-size: 9px; color: #eee; padding: 2px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-square .btn { margin: 2px; background: linear-gradient(90deg, #ff9800, #ffb74d); color: #fff; font-size: 8px; font-weight: bold; text-align: center; padding: 3px 0; border-radius: 6px; }

        .grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 0 4px; }
        .card-game { background: #1a1a24; border-radius: 4px; overflow: hidden; cursor: pointer; transition: transform .15s; }
        .card-game .thumb { position: relative; width: 100%; aspect-ratio: 4 / 3; background: #333; }
        .card-game .tag { position: absolute; top: 2px; left: 2px; background: #e55c5c; color: #fff; font-size: 7px; padding: 1px 3px; border-radius: 2px; z-index: 2; }
        .card-game .play-btn { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 18px; height: 18px; background: rgba(255,255,255,.35); border-radius: 50%; display: flex; align-items: center; justify-content: center; z-index: 2; }
        .card-game .play-btn::after { content: ''; width: 0; height: 0; border-top: 3px solid transparent; border-bottom: 3px solid transparent; border-left: 6px solid #fff; margin-left: 2px; }
        .card-game .name { font-size: 9px; color: #eee; padding: 2px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-game .btn { margin: 2px; background: linear-gradient(90deg, #00bcd4, #26c6da); color: #fff; font-size: 8px; font-weight: bold; text-align: center; padding: 3px 0; border-radius: 6px; }

        /* ===== 分页 & 底部导航 ===== */
        .pagination { display: flex; justify-content: center; align-items: center; gap: 4px; padding: 8px 0 16px 0; flex-wrap: wrap; }
        .page-item { min-width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #aaa; cursor: pointer; }
        .page-item.active { background: #ff9800; color: #fff; font-weight: bold; }
        .page-item.dots { color: #888; cursor: default; }

        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; height: 46px; background: #16161e; border-top: 1px solid #2a2a3a; display: flex; justify-content: space-around; align-items: center; z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 1px; font-size: 9px; color: #888; cursor: pointer; }
        .nav-item.active { color: #fff; }
        .nav-icon { font-size: 16px; line-height: 1; }
        .nav-item.center { transform: translateY(-4px); }
        .nav-item.center .nav-icon { width: 34px; height: 34px; background: linear-gradient(135deg,#a855f7,#ec4899); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; box-shadow: 0 2px 6px rgba(168,85,247,.4); border: 2px solid #16161e; }

        /* ===== 悬浮按钮 ===== */
        .floating-btns { position: fixed; right: 6px; bottom: 100px; display: flex; flex-direction: column; gap: 6px; z-index: 99; }
        .float-btn { width: 28px; height: 28px; background: rgba(30, 30, 40, 0.85); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #ccc; border: 1px solid #3a3a4a; cursor: pointer; }
        .float-btn.ai-btn { background: #d6e4ff; color: #2d6cff; border: none; font-size: 10px; font-weight: bold; }
        .float-btn.close-btn { background: rgba(120, 120, 130, 0.85); color: #fff; }
        .float-dot { position: fixed; right: 6px; bottom: 40px; width: 32px; height: 32px; background: linear-gradient(135deg, #4facfe, #00c6fb); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 14px; }

        /* ===== 弹窗 ===== */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.7); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 20px; }
        .modal-overlay.show { display: flex; }
        .modal-box { width: 100%; max-width: 320px; background: #fff; border-radius: 16px; padding: 20px 16px 16px; position: relative; animation: popIn .25s ease; color: #222; }
        @keyframes popIn { from { opacity: 0; transform: scale(.9); } to { opacity: 1; transform: scale(1); } }
        .modal-close { position: absolute; top: 10px; right: 12px; font-size: 18px; color: #aaa; cursor: pointer; line-height: 1; padding: 4px; background: none; border: none; }
        .modal-title { text-align: center; font-size: 15px; font-weight: bold; color: #222; line-height: 1.5; margin-bottom: 14px; }

        .modal-video-card { display: flex; gap: 10px; align-items: center; background: #f3f3f7; border-radius: 10px; padding: 8px; margin-bottom: 14px; }
        .modal-video-cover { width: 60px; height: 60px; border-radius: 6px; overflow: hidden; flex-shrink: 0; background: #ddd; }
        .modal-video-meta { flex: 1; min-width: 0; }
        .modal-video-name { font-size: 13px; font-weight: bold; color: #222; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .modal-video-stats { display: flex; gap: 10px; font-size: 11px; color: #888; }

        .btn-pay { display: block; width: 100%; background: linear-gradient(90deg,#ff9800,#ffb74d); color: #fff; border: none; border-radius: 20px; padding: 10px 0; font-size: 15px; font-weight: bold; cursor: pointer; margin-bottom: 8px; text-align: center; }
        .btn-pay .vip-badge { display: inline-block; background: #222; color: #ffcc00; font-size: 9px; font-style: italic; font-weight: bold; padding: 2px 6px; border-radius: 8px; margin-left: 4px; vertical-align: middle; }
        .btn-pay .sub, .btn-free .sub { display: block; font-size: 11px; font-weight: normal; opacity: .9; margin-top: 1px; }
        .btn-free { display: block; width: 100%; background: linear-gradient(90deg,#ff2d78,#ff5c9d); color: #fff; border: none; border-radius: 20px; padding: 10px 0; font-size: 15px; font-weight: bold; cursor: pointer; margin-bottom: 12px; text-align: center; }
        .modal-footer { text-align: center; font-size: 11px; color: #ff9800; background: #fff7e6; border: 1px dashed #ffcc80; border-radius: 16px; padding: 6px; }
        .modal-footer #modalCount { color: #ff6b00; font-weight: bold; transition: color .3s; }

        /* ===== 欢迎弹窗 ===== */
        .welcome-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); display: none; align-items: center; justify-content: center; z-index: 10000; padding: 24px; }
        .welcome-overlay.show { display: flex; }
        .welcome-box { width: 100%; max-width: 340px; background: linear-gradient(180deg, #fff5f7 0%, #ffffff 100%); border-radius: 18px; padding: 24px 20px 20px; position: relative; box-shadow: 0 20px 60px rgba(0,0,0,.35); animation: welcomePop .35s ease; color: #333; }
        @keyframes welcomePop { from { opacity: 0; transform: scale(.9) translateY(-20px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        .welcome-box .title { text-align: center; font-size: 20px; font-weight: 900; color: #e0447a; letter-spacing: 4px; margin-bottom: 18px; }
        .welcome-box .text { font-size: 12px; line-height: 1.8; color: #444; margin-bottom: 12px; }
        .welcome-box .text p { margin-bottom: 10px; }
        .welcome-box .text .emph { color: #e0447a; font-weight: bold; }
        .welcome-box .btn-confirm { display: block; width: 100%; background: linear-gradient(90deg, #f06292, #ec407a); color: #fff; border: none; border-radius: 25px; padding: 12px 0; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 6px; letter-spacing: 4px; box-shadow: 0 4px 12px rgba(236,64,122,.35); transition: transform .15s; }
        .welcome-box .btn-confirm:active { transform: scale(.97); }

        /* ===== 右下角通知 ===== */
        .toast-container { position: fixed; right: 8px; bottom: 90px; display: flex; flex-direction: column-reverse; gap: 6px; z-index: 9998; pointer-events: none; }
        .toast-item { display: flex; align-items: center; gap: 6px; background: rgba(30, 30, 40, 0.95); color: #fff; padding: 6px 12px 6px 6px; border-radius: 24px; font-size: 11px; box-shadow: 0 4px 10px rgba(0,0,0,.3); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); border: 1px solid rgba(255,255,255,.1); transform: translateY(20px); opacity: 0; transition: all .4s ease; max-width: 240px; pointer-events: auto; }
        .toast-item.show { transform: translateY(0); opacity: 1; }
        .toast-avatar { width: 24px; height: 24px; border-radius: 50%; overflow: hidden; flex-shrink: 0; background: #444; border: 1px solid rgba(255,255,255,.2); }
        .toast-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .toast-text { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #ddd; }
        .toast-text .name { color: #4ade80; font-weight: bold; }
    </style>
</head>
<body>

    <div class="top-notice">
        <div class="top-notice-content">
            <span>这是一个资源站</span>，想要什么资源，可以在搜索框自己搜。
        </div>
    </div>

    <!-- 顶部两排分类 -->
    <div class="top-banners">
        <div class="banner-item banner-hot active" data-cat="hot">🔥 热门</div>
        <div class="banner-item banner-anime" data-cat="anime">📺 动漫</div>
        <div class="banner-item banner-comic" data-cat="comic">📘 漫画</div>
    </div>
    <div class="second-banners">
        <div class="banner-item" data-cat="soft">💻 软件</div>
        <div class="banner-item" data-cat="resource">💎 资源</div>
        <div class="banner-item" data-cat="game">🏆 游戏</div>
    </div>

    <!-- 搜索框 -->
    <div class="search-section">
        <div class="search-box">
            <div class="search-icon">🔍</div>
            <input type="text" id="searchInput" placeholder="请输入关键词搜索你想要的资源">
            <button class="search-btn" id="searchBtn">搜索</button>
        </div>
        <div class="search-hint">
            <span>🔍</span> 网站未显示的资源，可以通过搜索框查找
        </div>

        <div class="search-alert" id="searchAlert">
            <div class="alert-text"><span class="icon">⚠️</span> 搜索次数已达上限，获取口令后解锁全部资源！</div>
            <button class="btn-unlock" id="btnUnlock">立即解锁</button>
        </div>
    </div>

    <!-- 实时在线人数（圆圈包裹） -->
    <div class="online-wrapper">
        <div class="online-bar">
            <span class="online-icon">👥</span> 当前在线：
            <strong class="online-num" id="onlineNum">1963</strong> 人
            <div class="online-dot"></div>
        </div>
    </div>

    <div class="cat-bar">
        <div class="icon" id="catIcon">🔥</div>
        <div class="title" id="catTitle">热门</div>
        <div class="subtitle" id="catSubtitle">最热资源，一键直达</div>
    </div>

    <div class="content-area" id="contentArea"></div>

    <div class="pagination" id="pagination"></div>

    <!-- 底部导航 -->
    <div class="bottom-nav">
        <div class="nav-item active" data-nav="home"><div class="nav-icon">🏠</div><span>首页</span></div>
        <div class="nav-item" data-nav="circle"><div class="nav-icon">🎨</div><span>圈子</span></div>
        <div class="nav-item center" data-nav="live"><div class="nav-icon">▶️</div><span>直播</span></div>
        <div class="nav-item" data-nav="mine"><div class="nav-icon">👤</div><span>我的</span></div>
    </div>

    <div class="floating-btns">
        <div class="float-btn ai-btn" id="floatAI">AI</div>
        <div class="float-btn" id="floatSearch">🔍</div>
        <div class="float-btn" id="floatUp">▲</div>
        <div class="float-btn" id="floatDown">▼</div>
        <div class="float-btn" id="floatRefresh">🔄</div>
        <div class="float-btn close-btn" id="floatClose">✕</div>
    </div>
    <div class="float-dot" id="floatDot">⊕</div>

    <div class="toast-container" id="toastContainer"></div>

    <!-- 弹窗 -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box">
            <button class="modal-close" id="modalClose">✕</button>
            <div class="modal-title">请选择一种方式<br>获取网站所有资源</div>
            
            <div class="modal-video-card">
                <div class="modal-video-cover">
                    <img id="modalCover" src="" alt="封面">
                </div>
                <div class="modal-video-meta">
                    <div class="modal-video-name" id="modalName">视频标题</div>
                    <div class="modal-video-stats">
                        <span>👁️ <span id="modalViews">0</span></span>
                        <span>⏱ <span id="modalDuration">00:00</span></span>
                    </div>
                </div>
            </div>

                    <div class="btn">下载游戏</div>
                </div>
            `).join('') + '</div>';
        }

        function switchCat(cat) {
            const meta = CAT_META[cat] || CAT_META.hot;
            catIcon.textContent = meta.icon;
            catTitle.textContent = meta.title;
            catSubtitle.textContent = meta.subtitle;

            document.querySelectorAll('[data-cat]').forEach(el => {
                el.classList.toggle('active', el.getAttribute('data-cat') === cat);
            });

            switch (cat) {
                case 'anime':    renderAnime(); break;
                case 'comic':    renderComic(); break;
                case 'soft':     renderSoft(); break;
                case 'resource': renderResource(); break;
                case 'game':     renderGame(); break;
                default:         renderHot(); break;
            }

            buildPagination();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        document.querySelectorAll('[data-cat]').forEach(el => {
            el.addEventListener('click', () => {
                switchCat(el.getAttribute('data-cat'));
            });
        });

        function buildPagination() {
            pagination.innerHTML = '';

            const prev = document.createElement('div');
            prev.className = 'page-item';
            prev.textContent = '‹';
            prev.onclick = () => openModal();
            pagination.appendChild(prev);

            const p1 = document.createElement('div');
            p1.className = 'page-item active';
            p1.textContent = '1';
            p1.onclick = () => window.scrollTo({ top: 0, behavior: 'smooth' });
            pagination.appendChild(p1);

            for (let i = 2; i <= 5; i++) {
                const el = document.createElement('div');
                el.className = 'page-item';
                el.textContent = i;
                el.onclick = () => openModal();
                pagination.appendChild(el);
            }

            const dots = document.createElement('div');
            dots.className = 'page-item dots';
            dots.textContent = '...';
            pagination.appendChild(dots);

            const p99 = document.createElement('div');
            p99.className = 'page-item';
            p99.textContent = '99+';
            p99.onclick = () => openModal();
            pagination.appendChild(p99);

            const next = document.createElement('div');
            next.className = 'page-item';
            next.textContent = '›';
            next.onclick = () => openModal();
            pagination.appendChild(next);
        }

        const overlay = document.getElementById('modalOverlay');
        const modalCover = document.getElementById('modalCover');
        const modalName = document.getElementById('modalName');
        const modalViews = document.getElementById('modalViews');
        const modalDuration = document.getElementById('modalDuration');

        function openModal(item) {
            if (item) {
                modalCover.src = item.img || '';
                modalName.textContent = item.name || '获取资源';
                // 如果弹窗里的是 RANDOM，也重新随机一下
                modalViews.textContent = item.views === 'RANDOM' ? getRandomViews() : (item.views || '0');
                modalDuration.textContent = item.dur || ''; 
                modalDuration.parentElement.style.display = item.dur ? 'flex' : 'none';
            } else {
                modalCover.src = 'https://zy.bbkk.mom/img/hlbt.jpg?v=20261017';
                modalName.textContent = '获取网站所有资源';
                modalViews.textContent = getRandomViews();
                modalDuration.textContent = '00:33:26';
                modalDuration.parentElement.style.display = 'flex';
            }
            overlay.classList.add('show');
            document.body.style.overflow = 'hidden';
        }
        
        function closeModal() {
            overlay.classList.remove('show');
            document.body.style.overflow = '';
        }
        document.getElementById('modalClose').addEventListener('click', closeModal);
        overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });

        document.getElementById('btnPay').addEventListener('click', () => location.href = 'pay.html');
        document.getElementById('btnFree').addEventListener('click', () => location.href = 'task.html');

        document.querySelectorAll('.nav-item').forEach(el => {
            el.addEventListener('click', () => {
                const nav = el.getAttribute('data-nav');
                if (nav === 'home') return;
                openModal();
            });
        });

        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const searchAlert = document.getElementById('searchAlert');

        function doSearch() {
            const kw = searchInput.value.trim();
            if (!kw) return alert('请输入搜索关键词');
            searchAlert.classList.add('show');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
        searchBtn.addEventListener('click', doSearch);
        searchInput.addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });

        document.getElementById('btnUnlock').addEventListener('click', () => openModal());

        const onlineNum = document.getElementById('onlineNum');
        let currentOnline = 1963;

        function tickOnline() {
            const delta = Math.floor(Math.random() * 21) - 10;
            currentOnline += delta;
            if (currentOnline < 1500) currentOnline = 1500;
            if (currentOnline > 2500) currentOnline = 2500;

            onlineNum.textContent = currentOnline;
            setTimeout(tickOnline, 1000 + Math.random() * 2000);
        }
        tickOnline();

        const modalCount = document.getElementById('modalCount');
        let countValue = 56280;

        function tickModalCount() {
            countValue += Math.floor(Math.random() * 3) + 1;
            modalCount.textContent = countValue;
            setTimeout(tickModalCount, 3000 + Math.random() * 3000);
        }
        tickModalCount();

        const toastContainer = document.getElementById('toastContainer');
        const AVATAR_SEEDS = [
            'a1','b2','c3','d4','e5','f6','g7','h8','i9','j10',
            'k11','l12','m13','n14','o15','p16','q17','r18','s19','t20',
            'u21','v22','w23','x24','y25','z26','A1','B2','C3','D4'
        ];

        function pickRandom(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        function randomUser() {
            const digits = Math.floor(Math.random() * 900) + 10;
            return '***' + digits;
        }

        function showToast() {
            const item = document.createElement('div');
            item.className = 'toast-item';

            const name = randomUser();
            const seed = pickRandom(AVATAR_SEEDS);
            const avatarUrl = `https://api.dicebear.com/7.x/thumbs/svg?seed=${seed}`;

            item.innerHTML = `
                <div class="toast-avatar"><img src="${avatarUrl}" alt="avatar"></div>
                <div class="toast-text">
                    <span class="name">${name}</span> 刚刚已获取到资源
                </div>
            `;

            toastContainer.appendChild(item);
            requestAnimationFrame(() => item.classList.add('show'));

            setTimeout(() => {
                item.classList.remove('show');
                setTimeout(() => item.remove(), 400);
            }, 3000);
        }

        function loopToast() {
            showToast();
            const next = 2500 + Math.random() * 2500;
            setTimeout(loopToast, next);
        }
        setTimeout(loopToast, 1500);

        document.getElementById('floatAI').addEventListener('click', () => alert('AI 助手：可以帮你搜索资源、解答问题'));
        document.getElementById('floatSearch').addEventListener('click', () => {
            window.scrollTo({ top: 0, behavior: 'smooth' });
            searchInput.focus();
        });
        document.getElementById('floatUp').addEventListener('click', () => window.scrollBy({ top: -window.innerHeight * 0.8, behavior: 'smooth' }));
        document.getElementById('floatDown').addEventListener('click', () => window.scrollBy({ top: window.innerHeight * 0.8, behavior: 'smooth' }));
        document.getElementById('floatRefresh').addEventListener('click', () => location.reload());
        document.getElementById('floatClose').addEventListener('click', () => {
            if (confirm('确定要离开本站吗？')) history.back();
        });
        document.getElementById('floatDot').addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

        const welcomeOverlay = document.getElementById('welcomeOverlay');
        welcomeOverlay.classList.add('show');
        document.body.style.overflow = 'hidden';

        document.getElementById('btnWelcomeConfirm').addEventListener('click', () => {
            welcomeOverlay.classList.remove('show');
            document.body.style.overflow = '';
        });

        switchCat('hot');
    </script>
</body>
</html>
