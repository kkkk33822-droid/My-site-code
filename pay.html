<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>支付审核 - 获取资源</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #f5f6fa; color: #222; min-height: 100vh; padding: 20px 0 30px;
        }
        ::-webkit-scrollbar { display: none; }
        .pay-card { background: #fff; border-radius: 20px; margin: 0 14px; padding: 26px 18px 22px; box-shadow: 0 4px 20px rgba(0,0,0,.05); }
        .pay-title { text-align: center; font-size: 22px; font-weight: 900; color: #1a1a2e; letter-spacing: 1px; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .pay-title .star { font-size: 18px; color: #6c5ce7; }
        .pay-subtitle { text-align: center; font-size: 12px; color: #888; margin-top: 10px; background: #f5f5f8; display: inline-block; padding: 5px 14px; border-radius: 14px; margin-left: 50%; transform: translateX(-50%); }
        
        .qr-section { margin-top: 22px; background: #f0f2f5; border-radius: 14px; padding: 14px 10px; }
        .qr-inner { background: #fff; border-radius: 10px; padding: 24px 20px 0; text-align: center; position: relative; overflow: hidden; }
        .qr-code-box { width: 180px; height: 180px; margin: 0 auto 16px; position: relative; display: flex; align-items: center; justify-content: center; }
        .qr-placeholder { position: absolute; inset: 0; background: #f8f9fb; border: 2px dashed #dcdde1; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; z-index: 10; transition: all .3s; }
        .qr-placeholder svg { width: 40px; height: 40px; fill: #a4b0be; margin-bottom: 10px; }
        .qr-placeholder .text { font-size: 13px; color: #747d8c; font-weight: bold; }
        .qr-img { width: 100%; height: 100%; object-fit: contain; border-radius: 8px; display: none; }
        .qr-name { font-size: 16px; color: #333; margin-bottom: 20px; font-weight: 500; }
        .qr-banner { margin: 0 -20px; background: linear-gradient(90deg, #e8c365, #d4a73a); color: #fff; font-size: 14px; font-weight: bold; padding: 12px 0; text-align: center; letter-spacing: 1px; }
        
        .action-btns { display: flex; gap: 10px; margin-top: 14px; }
        .btn-refresh-dark, .btn-save-qr { display: flex; align-items: center; justify-content: center; gap: 6px; flex: 1; border: none; border-radius: 25px; padding: 13px 0; font-size: 14px; font-weight: bold; cursor: pointer; transition: background .2s; }
        .btn-refresh-dark { background: #1f3a4d; color: #fff; }
        .btn-refresh-dark:active { background: #152a39; }
        .btn-save-qr { background: #00b894; color: #fff; }
        .btn-save-qr:active { background: #009473; }
        
        .warn-yellow { text-align: center; font-size: 12px; color: #c59b0f; margin-top: 10px; }
        .warn-red-box { background: #f5e8ff; color: #c0392b; font-size: 13px; font-weight: bold; text-align: center; padding: 12px; border-radius: 10px; margin-top: 16px; }
        
        .upload-zone { display: block; border: 2px dashed #c8cfe0; border-radius: 16px; padding: 30px 16px 22px; text-align: center; background: #fff; margin-top: 18px; position: relative; cursor: pointer; transition: all .2s; }
        .upload-zone:hover { border-color: #6c5ce7; background: #faf8ff; }
        .upload-zone .upload-icon { font-size: 36px; margin-bottom: 12px; }
        .upload-zone .upload-title { font-size: 15px; font-weight: bold; color: #1a1a2e; }
        .upload-zone .upload-title .star { color: #6c5ce7; }
        .upload-zone .upload-hint { font-size: 12px; color: #999; margin-top: 6px; }
        .upload-zone input[type="file"] { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
        
        .upload-preview { display: none; margin-top: 14px; border-radius: 12px; overflow: hidden; border: 1px solid #eee; position: relative; }
        .upload-preview.show { display: block; }
        .upload-preview img { width: 100%; display: block; }
        .upload-preview .re-upload { position: absolute; bottom: 8px; right: 8px; background: rgba(0,0,0,.65); color: #fff; border: none; border-radius: 16px; padding: 5px 12px; font-size: 12px; cursor: pointer; }
        
        .btn-submit { display: block; width: 100%; background: #c8cdd6; color: #fff; border: none; border-radius: 26px; padding: 15px 0; font-size: 16px; font-weight: bold; margin-top: 14px; cursor: not-allowed; transition: all .3s; }
        .btn-submit.active { background: linear-gradient(90deg, #7b2ff7, #2d6cff); cursor: pointer; box-shadow: 0 6px 16px rgba(123,47,247,.35); }
        .btn-submit.active:active { opacity: .85; }
        
        .bottom-tip { font-size: 12px; text-align: center; padding: 10px 12px; border-radius: 10px; margin-top: 14px; line-height: 1.5; }
        .bottom-tip.pink { background: #ffe9f0; color: #e0447a; }
        .bottom-tip.gray { background: #eef0f4; color: #666; }

        /* Loading & 弹窗遮罩 */
        .loading-mask, .success-modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; align-items: center; justify-content: center; z-index: 9999; color: #fff; font-size: 15px; flex-direction: column; gap: 12px; padding: 20px; text-align: center; }
        .loading-mask.show, .success-modal-mask.show { display: flex; }
        .spinner { width: 40px; height: 40px; border: 4px solid rgba(255,255,255,.3); border-top-color: #fff; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .save-modal { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: none; align-items: center; justify-content: center; flex-direction: column; z-index: 10000; padding: 20px; }
        .save-modal.show { display: flex; }
        .save-modal .save-tip { color: #fff; font-size: 16px; font-weight: bold; margin-bottom: 20px; background: rgba(255,255,255,.2); padding: 10px 24px; border-radius: 20px; }
        .save-modal img { width: 85%; max-width: 320px; border-radius: 12px; background: #fff; padding: 12px; display: block; }
        .save-modal .save-warn { color: #ffb74d; font-size: 14px; margin-top: 20px; }
        .save-modal .close-save { margin-top: 25px; background: #fff; color: #333; border: none; padding: 12px 50px; border-radius: 25px; font-size: 16px; font-weight: bold; cursor: pointer; }

        /* 右下角动态弹窗 */
        .dynamic-toast-wrapper { position: fixed; right: 14px; bottom: 20px; z-index: 9998; pointer-events: none; opacity: 0; transform: translateY(20px); transition: all 0.4s ease; }
        .dynamic-toast-wrapper.show { opacity: 1; transform: translateY(0); }
        .dynamic-toast { background: #1c242f; border: 2px solid #d4a73a; border-radius: 16px; padding: 12px 16px; display: flex; align-items: center; gap: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); min-width: 280px; }
        .dynamic-toast-avatar { width: 44px; height: 44px; border-radius: 50%; background: #ff9800; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; border: 2px solid #fff; box-shadow: 0 0 10px rgba(255,152,0,0.5); }
        .dynamic-toast-content { flex: 1; }
        .dynamic-toast-top { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
        .dynamic-toast-name { color: #d4a73a; font-size: 14px; font-weight: bold; }
        .dynamic-toast-time { color: #d4a73a; font-size: 12px; font-weight: normal; }
        .dynamic-toast-text { color: #fff; font-size: 13px; margin-bottom: 6px; font-weight: bold;}
        .dynamic-toast-text span { color: #d4a73a; }
        .dynamic-toast-bottom { font-size: 11px; color: #aaa; display: flex; align-items: center; gap: 6px; }
        .dynamic-toast-bottom .check { color: #4ade80; font-weight: bold; }

        /* 解锁成功提示框 */
        .success-box { background: #fff; border-radius: 16px; padding: 30px 24px; text-align: center; width: 85%; max-width: 320px; color: #333; animation: popIn 0.3s ease; }
        @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .success-box .icon { font-size: 50px; margin-bottom: 10px; }
        .success-box h3 { font-size: 20px; margin-bottom: 10px; color: #1a1a2e; }
        .success-box p { font-size: 14px; color: #666; margin-bottom: 24px; }
        .success-box .btn-ok { display: block; width: 100%; background: linear-gradient(90deg, #7b2ff7, #2d6cff); color: #fff; border: none; border-radius: 25px; padding: 12px 0; font-size: 16px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="pay-card">
        <div class="pay-title"><span class="star">✦</span> 支付19.90元获取资源 <span class="star">✦</span></div>
        <div style="text-align:center;"><div class="pay-subtitle">🤖 AI审核 · 上传真实支付截图获取资源</div></div>

        <div class="qr-section">
            <div class="qr-inner">
                <div class="qr-code-box">
                    <div class="qr-placeholder" id="qrPlaceholder">
                        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 15h-2v-2h2v2zm0-4h-2V7h2v6zm4 4h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
                        <div class="text">点击获取最新二维码</div>
                    </div>
                    <img class="qr-img" id="qrImg" src="https://img-reg-ab.imagency.cn/a/202610/20/6ad7028c69f54.jpg" alt="收款码">
                </div>
                <div class="qr-name">“土豪专享”</div>
                <div class="qr-banner">渐变的赞赏码</div>
            </div>
        </div>

        <div class="action-btns">
            <button class="btn-refresh-dark" id="btnRefreshQR">🔄 刷新二维码</button>
            <button class="btn-save-qr" id="btnSaveQR">💾 保存二维码</button>
        </div>

        <div class="warn-yellow">⚠ 如无法加载，请刷新页面重试</div>
        <div class="warn-red-box">⚠ 如果收款码不能支付，请点击刷新二维码</div>

        <label class="upload-zone" for="fileInput" id="uploadZone">
            <div class="upload-icon">🖼️</div>
            <div class="upload-title"><span class="star">✦</span> 上传支付截图（AI 智能审核） <span class="star">✦</span></div>
            <div class="upload-hint">JPG · PNG · WEBP · GIF（≤ 12MB）</div>
            <input type="file" id="fileInput" accept="image/*">
        </label>

        <div class="upload-preview" id="uploadPreview">
            <img id="previewImg" src="" alt="预览">
            <button class="re-upload" id="btnReUpload">重新上传</button>
        </div>

        <button class="btn-submit" id="btnSubmit" disabled>提交支付截图，立即领取资源</button>

        <div class="bottom-tip pink">💡 上传支付截图 → AI自动审核（虚假截图会被拉黑IP和设备）</div>
        <div class="bottom-tip gray">⚠ 如遇异常跳转，请用 Chrome 浏览器打开</div>
    </div>

    <!-- 保存二维码弹窗 -->
    <div class="save-modal" id="saveModal">
        <div class="save-tip">👇 长按下方二维码保存至相册</div>
        <img src="https://img-reg-ab.imagency.cn/a/202610/20/6ad7028c69f54.jpg" alt="长按保存">
        <div class="save-warn">⚠ 如果无法保存，请直接截图保存</div>
        <button class="close-save" id="btnCloseSave">我知道了</button>
    </div>

    <!-- Loading (审核中) -->
    <div class="loading-mask" id="loadingMask">
        <div class="spinner"></div>
        <div id="loadingText">正在提交，请稍候...</div>
        <div class="tip" id="loadingTip">AI 正在审核你的支付截图</div>
    </div>

    <!-- 解锁成功弹窗 -->
    <div class="success-modal-mask" id="successMask">
        <div class="success-box">
            <div class="icon">✅</div>
            <h3>审核通过！</h3>
            <p>全站资源已解锁，即将为你跳转...</p>
            <button class="btn-ok" id="btnGoSuccess">确 定</button>
        </div>
    </div>

    <!-- 右下角动态弹窗 -->
    <div class="dynamic-toast-wrapper" id="dynamicToast">
        <div class="dynamic-toast">
            <div class="dynamic-toast-avatar" id="toastAvatar">🎉</div>
            <div class="dynamic-toast-content">
                <div class="dynamic-toast-top">
                    <span class="dynamic-toast-name" id="toastName">杭州用户</span>
                    <span class="dynamic-toast-time" id="toastTime">14:40</span>
                </div>
                <div class="dynamic-toast-text">支付成功，解锁了 <span>全站资源</span></div>
                <div class="dynamic-toast-bottom">
                    <span class="check">✅</span> 已自动发货 · <span>🔒</span> 永久有效
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==================== 右下角动态弹窗逻辑 ====================
        const toastEl = document.getElementById('dynamicToast');
        const toastAvatar = document.getElementById('toastAvatar');
        const toastName = document.getElementById('toastName');
        const toastTime = document.getElementById('toastTime');
        const provinces = ['北京', '上海', '广州', '深圳', '杭州', '成都', '武汉', '西安', '南京', '重庆'];
        const emojis = ['🎉', '😎', '🌟', '🔥', '👑', '🚀', '💎', '🎈'];

        function getRandomTime() {
            const now = new Date();
            return `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
        }
        function showDynamicToast() {
            toastName.textContent = `${provinces[Math.floor(Math.random() * provinces.length)]}用户`;
            toastAvatar.textContent = emojis[Math.floor(Math.random() * emojis.length)];
            toastTime.textContent = getRandomTime();
            toastEl.classList.add('show');
            setTimeout(() => {
                toastEl.classList.remove('show');
                setTimeout(showDynamicToast, 1000 + Math.random() * 2000);
            }, 1500);
        }
        setTimeout(showDynamicToast, 1000);

        // ==================== 支付与审核逻辑 ====================
        const fileInput = document.getElementById('fileInput');
        const uploadPreview = document.getElementById('uploadPreview');
        const previewImg = document.getElementById('previewImg');
        const btnSubmit = document.getElementById('btnSubmit');
        const loadingMask = document.getElementById('loadingMask');
        const successMask = document.getElementById('successMask');
        
        const qrPlaceholder = document.getElementById('qrPlaceholder');
        const qrImg = document.getElementById('qrImg');
        const saveModal = document.getElementById('saveModal');

        let currentFile = null;
        let attemptCount = 0; // 记录提交次数

        qrPlaceholder.addEventListener('click', () => { 
            qrPlaceholder.style.display = 'none'; 
            qrImg.style.display = 'block'; 
        });

        document.getElementById('btnRefreshQR').addEventListener('click', () => {
            qrImg.style.display = 'none'; 
            qrPlaceholder.style.display = 'flex';
            setTimeout(() => { 
                qrPlaceholder.style.display = 'none'; 
                qrImg.style.display = 'block'; 
            }, 500);
        });

        document.getElementById('btnSaveQR').addEventListener('click', () => saveModal.classList.add('show'));
        document.getElementById('btnCloseSave').addEventListener('click', () => saveModal.classList.remove('show'));

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            currentFile = file;
            const reader = new FileReader();
            reader.onload = (ev) => {
                previewImg.src = ev.target.result;
                uploadPreview.classList.add('show');
                btnSubmit.classList.add('active');
                btnSubmit.disabled = false;
            };
            reader.readAsDataURL(file);
            fileInput.value = '';
        });
        document.getElementById('btnReUpload').addEventListener('click', (e) => { e.preventDefault(); fileInput.click(); });

        // ==================== 新版“两次审核”逻辑 ====================
        btnSubmit.addEventListener('click', () => {
            if (!currentFile) { alert('请先上传支付截图'); return; }

            loadingMask.classList.add('show');
            document.getElementById('loadingText').textContent = 'AI 正在审核中...';
            document.getElementById('loadingTip').textContent = '正在比对数据库，请勿关闭页面';

            setTimeout(() => {
                loadingMask.classList.remove('show');
                attemptCount++; // 记录已经提交了一次

                if (attemptCount === 1) {
                    // 第一次，强制提示失败
                    alert('❌ 审核未通过\n\n系统提示：图片边缘不清晰或未检测到关键特征，请重新拍摄/截取完整账单后再次上传。');
                } else {
                    // 第二次，直接通过
                    successMask.classList.add('show');
                    document.getElementById('btnGoSuccess').onclick = () => {
                        location.href = 'success.html'; 
                    };
                }
            }, 2000); // 模拟加载时间
        });
    </script>
</body>
</html>
