<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>完成任务获取资源</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #f3f4f8; color: #222; padding-bottom: 30px; }
        ::-webkit-scrollbar { display: none; }

        /* 顶部倒计时 */
        .task-header {
            background: linear-gradient(90deg, #ff6b35, #ff8c42);
            color: #fff; font-size: 13px; padding: 10px 0;
            text-align: center; font-weight: bold;
            position: sticky; top: 0; z-index: 10;
            box-shadow: 0 2px 6px rgba(255,107,53,.3);
        }

        /* 大标题 */
        .title-card { background: #fff; margin: 12px; border-radius: 12px; padding: 22px 16px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,.05); }
        .title-main {
            font-size: 22px; font-weight: 900; color: #111;
            line-height: 1.45; letter-spacing: 1px;
            text-shadow: 2px 2px 0 #ffd54f, -2px 2px 0 #ffd54f, 2px -2px 0 #ffd54f, -2px -2px 0 #ffd54f;
        }
        .title-sub { font-size: 13px; color: #e53935; margin-top: 10px; font-weight: bold; }

        /* 步骤卡片 */
        .step-card { background: #fff; margin: 12px; border-radius: 12px; padding: 14px; box-shadow: 0 2px 8px rgba(0,0,0,.05); }
        .step-label { display: flex; align-items: flex-start; gap: 8px; font-size: 14px; font-weight: bold; color: #222; margin-bottom: 12px; line-height: 1.5; }
        .step-num {
            width: 22px; height: 22px;
            background: #e53935; color: #fff;
            border-radius: 50%; font-size: 13px;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; flex-shrink: 0; margin-top: 1px;
        }

        .copy-box { background: #fafafa; border: 1px solid #eee; border-radius: 8px; padding: 12px; font-size: 13px; color: #555; margin-bottom: 10px; word-break: break-all; line-height: 1.6; }
        .btn-copy {
            display: flex; align-items: center; justify-content: center; gap: 6px;
            width: 100%; background: #2f9cf4; color: #fff;
            border: none; border-radius: 22px; padding: 12px 0;
            font-size: 14px; font-weight: bold; cursor: pointer;
        }
        .btn-copy:active { background: #1a85e0; }

        .keyword-row { display: flex; align-items: center; gap: 10px; background: #fafafa; border: 1px solid #eee; border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; }
        .keyword-text { flex: 1; font-size: 14px; color: #333; font-weight: bold; }
        .btn-douyin {
            display: flex; align-items: center; gap: 4px;
            background: #2f9cf4; color: #fff;
            border: none; border-radius: 8px;
            padding: 8px 12px; font-size: 13px; font-weight: bold;
            cursor: pointer;
        }
        .btn-douyin:active { background: #1a85e0; }

        .warn-text { font-size: 12px; color: #e53935; line-height: 1.5; margin-top: 6px; }
        .demo-label { text-align: center; font-size: 13px; color: #2f9cf4; font-weight: bold; margin: 14px 0 8px; }
        .demo-img { border-radius: 10px; overflow: hidden; border: 1px solid #eee; margin-bottom: 10px; position: relative; }
        .demo-img img { width: 100%; display: block; }
        .demo-caption { background: #fff9e6; color: #e53935; font-size: 13px; font-weight: bold; text-align: center; padding: 8px; }

        /* 提交按钮 */
        .btn-submit {
            display: block; width: 100%;
            background: linear-gradient(90deg, #7b2ff7, #2d6cff);
            color: #fff; border: none; border-radius: 26px;
            padding: 15px 0; font-size: 16px; font-weight: bold;
            cursor: pointer;
            box-shadow: 0 6px 16px rgba(123,47,247,.35);
        }
        .btn-submit:active { opacity: .85; }
        .submit-tip {
            text-align: center;
            font-size: 12px;
            color: #888;
            margin-top: 10px;
        }

        /* 分类卡片 */
        .category-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            padding: 0 12px;
            margin-top: 14px;
        }
        .cat-item {
            border-radius: 12px;
            height: 110px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            font-weight: 900;
            color: #fff;
            text-shadow: 2px 2px 0 rgba(0,0,0,.3);
            letter-spacing: 3px;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }
        .cat-item:active { transform: scale(.97); }
        .cat-anime    { background: linear-gradient(135deg, #6a11cb, #2575fc); }
        .cat-comic    { background: linear-gradient(135deg, #f6d365, #fda085); }
        .cat-resource { background: linear-gradient(135deg, #11998e, #38ef7d); }
        .cat-game     { background: linear-gradient(135deg, #ff416c, #ff4b2b); }
        .cat-item::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,.2), transparent 60%);
        }

        /* 底部版权 */
        .footer-copyright {
            text-align: center;
            font-size: 12px;
            color: #aaa;
            padding: 20px 0 10px;
        }

        /* 实时审核通知 */
        .toast-container {
            position: fixed;
            right: 12px;
            bottom: 20px;
            display: flex;
            flex-direction: column-reverse;
            gap: 8px;
            z-index: 9998;
            pointer-events: none;
        }
        .toast-item {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(30, 30, 40, 0.95);
            color: #fff;
            padding: 8px 12px;
            border-radius: 30px;
            font-size: 12px;
            box-shadow: 0 4px 12px rgba(0,0,0,.3);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border: 1px solid rgba(255,255,255,.1);
            transform: translateY(20px);
            opacity: 0;
            transition: all .4s ease;
            max-width: 260px;
            pointer-events: auto;
        }
        .toast-item.show { transform: translateY(0); opacity: 1; }
        .toast-avatar {
            width: 26px; height: 26px;
            border-radius: 50%; overflow: hidden;
            flex-shrink: 0; background: #444;
            border: 1px solid rgba(255,255,255,.2);
        }
        .toast-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .toast-text {
            flex: 1;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            color: #ddd;
        }
        .toast-text .name { color: #4ade80; font-weight: bold; }
    </style>
</head>
<body>

    <!-- 顶部倒计时 -->
    <div class="task-header">⏱ 任务仅剩 <span id="countdown">14:18</span> 失效，请尽快完成</div>

    <!-- 大标题 -->
    <div class="title-card">
        <div class="title-main">完成以下简单任务<br>获得网站所有资源</div>
        <div class="title-sub">*1分钟即可完成</div>
    </div>

    <!-- 第一步 -->
    <div class="step-card">
        <div class="step-label"><span class="step-num">1</span> 第一步：复制下方生成的评论文案</div>
        <div class="copy-box" id="copyText">加载中...</div>
        <button class="btn-copy" id="btnCopy">📋 复制这条评论</button>
    </div>

    <!-- 第二步 -->
    <div class="step-card">
        <div class="step-label"><span class="step-num">2</span> 第二步：点击右侧"跳转抖音"按钮，搜索关键词并评论（共需评论4个视频，截4张图）</div>
        <div class="keyword-row">
            <div class="keyword-text">阿宅心愿</div>
            <button class="btn-douyin" id="btnDouyin">🎵 跳转抖音</button>
        </div>
        <div class="warn-text">⚠ 如果不能跳转或跳转后没有自动搜索关键词，请手动搜索</div>
        <div class="demo-label">👇下面是操作示范</div>
        
        <!-- 修改了这里的图片链接 -->
        <div class="demo-img">
            <img src="https://rw.bbkk.mom/img/%E7%A4%BA%E8%8C%83.jpg?v=20261017" alt="操作示范">
            <div class="demo-caption">刚刚复制的内容，必须点个赞</div>
        </div>
    </div>

    <!-- 第三步 -->
    <div class="step-card">
        <div class="step-label"><span class="step-num">3</span> 第三步：将评论截图提交即可获取资源</div>
        <button class="btn-submit" id="btnGoSubmit">📷 提交截图获取资源</button>
        <div class="submit-tip">提交之后系统会自动审核，自动发给你资源</div>
    </div>

    <!-- 分类卡片 -->
    <div class="category-grid">
        <div class="cat-item cat-anime">动漫</div>
        <div class="cat-item cat-comic">漫画</div>
        <div class="cat-item cat-resource">资源</div>
        <div class="cat-item cat-game">游戏</div>
    </div>

    <!-- 版权 -->
    <div class="footer-copyright">© 2026 资源领取中心</div>

    <!-- 实时审核通知容器 -->
    <div class="toast-container" id="toastContainer"></div>

    <script>
        // ==================== 评论文案随机生成 ====================
        const HANZI_POOL = '惟淮晏祈辞安晚星澜墨白清欢半夏南栀墨轩子瑜沐晨若溪倾尘孤城落雪听风归途青衫故人衫祈';

        // 抖音表情池
        const EMOJI_POOL = [
            '[晕]', '[红牌大师]', '[飞吻]', '[发呆]', '[右边]', '[叹气]',
            '[吐彩虹]', '[裂开]', '[哈欠]', '[互粉]', '[点火]', '[鄙视]',
            '[囧]', '[旺柴]', '[吃瓜]', '[看]', '[打脸]', '[狗头]',
            '[比心]', '[呲牙]', '[害羞]', '[翻白眼]', '[可怜]', '[酷]'
        ];

        function randomHanzi(n) {
            const arr = HANZI_POOL.split('');
            const picked = [];
            while (picked.length < n && arr.length) {
                const i = Math.floor(Math.random() * arr.length);
                picked.push(arr.splice(i, 1)[0]);
            }
            return picked.join('');
        }

        function randomEmoji() {
            return EMOJI_POOL[Math.floor(Math.random() * EMOJI_POOL.length)];
        }

        // 生成完整评论文案
        function generateComment() {
            // ✅ 前后共用同一个名字
            const name = randomHanzi(2);

            // ✅ 必定随机加上两个表情包
            const headEmoji1 = randomEmoji();
            const headEmoji2 = randomEmoji();
            const headEmojis = headEmoji1 + headEmoji2;

            // 中间的一个随机表情
            const midEmoji = randomEmoji();

            // 拼接：开头两个固定随机表情 + 名字 + 中间表情 + 固定结尾
            return `${headEmojis}kany.${name}beer ${name}删了就有${midEmoji},不能再让集美们受苦了[呲牙][调皮]`;
        }

        document.getElementById('copyText').textContent = generateComment();

        // ==================== 倒计时 ====================
        let countdownTimer = null;
        function startCountdown(seconds) {
            const el = document.getElementById('countdown');
            let remain = seconds;
            const render = () => {
                const m = String(Math.floor(remain / 60)).padStart(2, '0');
                const s = String(remain % 60).padStart(2, '0');
                el.textContent = `${m}:${s}`;
            };
            render();
            countdownTimer = setInterval(() => {
                remain--;
                if (remain <= 0) {
                    clearInterval(countdownTimer);
                    el.textContent = '00:00';
                    alert('任务已过期，请重新打开');
                    location.href = 'index.html';
                    return;
                }
                render();
            }, 1000);
        }
        startCountdown(14 * 60 + 18);

        // ==================== 复制评论 ====================
        document.getElementById('btnCopy').addEventListener('click', async () => {
            const text = document.getElementById('copyText').textContent;
            try {
                await navigator.clipboard.writeText(text);
                alert('✅ 评论文案已复制！');
            } catch (err) {
                const ta = document.createElement('textarea');
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                alert('✅ 评论文案已复制！');
            }
        });

        // ==================== 跳转抖音 ====================
        document.getElementById('btnDouyin').addEventListener('click', () => {
            const keyword = '阿宅心愿';
            window.location.href = `snssdk1128://search?keyword=${encodeURIComponent(keyword)}`;
            setTimeout(() => {
                window.open(`https://www.douyin.com/search/${encodeURIComponent(keyword)}`, '_blank');
            }, 1500);
        });

        // ==================== 提交截图：跳转 submit.html ====================
        document.getElementById('btnGoSubmit').addEventListener('click', () => {
            location.href = 'submit.html';
        });

        // ==================== 实时审核通过通知 ====================
        const toastContainer = document.getElementById('toastContainer');
        const avatarSeeds = ['a1','b2','c3','d4','e5','f6','g7','h8','i9','j10','k11','l12','m13','n14','o15'];

        function randomTail() {
            const n = Math.floor(Math.random() * 900) + 10;
            return `***${n}`;
        }

        function showToast() {
            const item = document.createElement('div');
            item.className = 'toast-item';
            const avatarSeed = avatarSeeds[Math.floor(Math.random() * avatarSeeds.length)];
            const avatarUrl = `https://api.dicebear.com/7.x/thumbs/svg?seed=${avatarSeed}`;

            item.innerHTML = `
                <div class="toast-avatar"><img src="${avatarUrl}" alt="avatar"></div>
                <div class="toast-text">
                    <span class="name">${randomTail()}</span> 刚刚已获取到资源
                </div>
            `;
            toastContainer.appendChild(item);
            requestAnimationFrame(() => item.classList.add('show'));
            setTimeout(() => {
                item.classList.remove('show');
                setTimeout(() => item.remove(), 400);
            }, 3000);
        }

        function loopToast() {
            showToast();
            const next = 2500 + Math.random() * 2500;
            setTimeout(loopToast, next);
        }
        setTimeout(loopToast, 1500);
    </script>
</body>
</html>
